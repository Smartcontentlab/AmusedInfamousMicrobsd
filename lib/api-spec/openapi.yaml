openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mission Control API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Command center overview
  - name: planning
    description: Main-agent idea shaping and launch checkpoints
  - name: projects
    description: Project portfolio management
  - name: agents
    description: AI agent roster management
  - name: capabilities
    description: Agent tool and skill assignments
  - name: approvals
    description: Human approval queue
  - name: tasks
    description: Work queue and kanban operations
  - name: skills
    description: Reusable agent skill packs
  - name: arena
    description: BuildOff simulation controls
  - name: staff
    description: AI employee capabilities and human approvals
  - name: runtimes
    description: Secure runtime connections and live staff controls
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get command center overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /mission-plans:
    get:
      operationId: listMissionPlans
      tags: [planning]
      summary: List saved main-agent plans
      responses:
        "200":
          description: Saved idea plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissionPlan"
    post:
      operationId: createMissionPlan
      tags: [planning]
      summary: Turn a brain dump into an actionable mission plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionPlanInput"
      responses:
        "201":
          description: Mission plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionPlan"
        "400":
          description: The brain dump is missing or too short after trimming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Project portfolio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents
      responses:
        "200":
          description: Agent roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Add an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /agents/{agentId}:
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update agent assignment or state
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /agents/{agentId}/capabilities:
    get:
      operationId: listAgentCapabilities
      tags: [capabilities]
      summary: List an agent's capabilities
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Attached capability packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentCapability"
    post:
      operationId: attachAgentCapability
      tags: [capabilities]
      summary: Attach a capability to an agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCapabilityInput"
      responses:
        "201":
          description: Capability attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCapability"
  /agents/{agentId}/capabilities/{skillId}:
    delete:
      operationId: detachAgentCapability
      tags: [capabilities]
      summary: Detach a capability from an agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/SkillId"
      responses:
        "204":
          description: Capability detached
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List human approval requests
      responses:
        "200":
          description: Approval queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
  /approvals/{approvalId}:
    patch:
      operationId: updateApproval
      tags: [approvals]
      summary: Resolve or hand off an approval request
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalUpdate"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List work queue tasks
      responses:
        "200":
          description: Work queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Add work to the queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Move or update a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: List reusable skill packs
      responses:
        "200":
          description: Skill collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
    post:
      operationId: createSkill
      tags: [skills]
      summary: Add a skill pack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInput"
      responses:
        "201":
          description: Skill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
  /skills/refresh:
    post:
      operationId: refreshSkillCatalog
      tags: [skills]
      summary: Refresh the approved Hermes and OpenClaw skill catalogs
      responses:
        "200":
          description: Catalog refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillCatalogRefreshResult"
  /agents/{agentId}/skills/{skillId}/equip:
    post:
      operationId: equipAgentSkill
      tags: [capabilities]
      summary: Equip a skill and request a safe runtime installation
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/SkillId"
      responses:
        "200":
          description: Skill already equipped or queued for installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipAgentSkillResult"
        "201":
          description: Skill equipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipAgentSkillResult"
  /arena:
    get:
      operationId: getArena
      tags: [arena]
      summary: Get BuildOff simulation state
      responses:
        "200":
          description: Arena state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arena"
  /arena/advance:
    post:
      operationId: advanceArena
      tags: [arena]
      summary: Advance the BuildOff simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArenaAdvanceInput"
      responses:
        "200":
          description: Updated arena state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arena"
  /runtime-connections:
    get:
      operationId: listRuntimeConnections
      tags: [runtimes]
      summary: List redacted runtime connections
      responses:
        "200":
          description: Runtime connections without secrets or URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeConnectionSafe"
    post:
      operationId: createRuntimeConnection
      tags: [runtimes]
      summary: Add a server-side runtime connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeConnectionInput"
      responses:
        "201":
          description: Runtime connection added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConnectionSafe"
  /runtime-connections/{connectionId}/check:
    post:
      operationId: checkRuntimeConnection
      tags: [runtimes]
      summary: Check a runtime and discover capabilities
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Runtime health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeHealth"
  /runtime-health:
    get:
      operationId: listRuntimeHealth
      tags: [runtimes]
      summary: List runtime health snapshots
      responses:
        "200":
          description: Runtime health
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeHealth"
  /agents/{agentId}/run:
    get:
      operationId: getAgentRun
      tags: [runtimes]
      summary: Get an agent's current or most recent run
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent run, or null when no run exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "204":
          description: No run exists
    post:
      operationId: launchAgentRun
      tags: [runtimes]
      summary: Launch a live agent run
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunInput"
      responses:
        "201":
          description: Live run launched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
  /agents/{agentId}/run/pause:
    post:
      operationId: pauseAgentRun
      tags: [runtimes]
      summary: Pause an agent run when supported
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Paused run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
  /agents/{agentId}/run/resume:
    post:
      operationId: resumeAgentRun
      tags: [runtimes]
      summary: Resume an agent run when supported
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Resumed run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
  /agents/{agentId}/run/stop:
    post:
      operationId: stopAgentRun
      tags: [runtimes]
      summary: Safely stop an agent run
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Stopped run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
  /agents/{agentId}/activity:
    get:
      operationId: listAgentActivity
      tags: [runtimes]
      summary: List recent activity for an agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent runtime activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /agents/{agentId}/tool-unlocks:
    get:
      operationId: getAgentToolAccess
      tags: [arena]
      summary: Get a contestant's current Season 0 tool permissions and audit trail
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Tool permission state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolAccess"
  /agents/{agentId}/tool-unlocks/{toolKey}:
    patch:
      operationId: updateAgentToolUnlock
      tags: [arena]
      summary: Grant or revoke one named contestant tool with an auditable reason
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - in: path
          name: toolKey
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolUnlockInput"
      responses:
        "200":
          description: Updated tool permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolAccess"
components:
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: number
    AgentId:
      in: path
      name: agentId
      required: true
      schema:
        type: number
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        type: number
    SkillId:
      in: path
      name: skillId
      required: true
      schema:
        type: number
    ApprovalId:
      in: path
      name: approvalId
      required: true
      schema:
        type: number
    ConnectionId:
      in: path
      name: connectionId
      required: true
      schema:
        type: number
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Project:
      type: object
      required: [id, name, status, incomeCents, updatedAt]
      properties:
        id:
          type: number
        name:
          type: string
        status:
          type: string
          enum: [planning, building, review, live, paused]
        incomeCents:
          type: number
        updatedAt:
          type: string
          format: date-time
        description:
          type: [string, "null"]
    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [planning, building, review, live, paused]
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [planning, building, review, live, paused]
        incomeCents:
          type: number
          minimum: 0
    Agent:
      type: object
      required: [id, name, role, provider, status, projectId, skillCount, room, computerStatus, phase, runtimeConnectionId]
      properties:
        id:
          type: number
        name:
          type: string
        role:
          type: string
        provider:
          type: string
        runtimeConnectionId:
          type: [number, "null"]
        status:
          type: string
          enum: [working, waiting, reviewing, blocked, offline]
        projectId:
          type: [number, "null"]
        skillCount:
          type: number
        currentTask:
          type: [string, "null"]
        room:
          type: string
        computerStatus:
          type: string
        businessIdea:
          type: [string, "null"]
        phase:
          type: string
        nextMove:
          type: [string, "null"]
    AgentInput:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
        projectId:
          type: number
        provider:
          type: string
    AgentUpdate:
      type: object
      properties:
        role:
          type: string
          minLength: 1
        status:
          type: string
          enum: [working, waiting, reviewing, blocked, offline]
        projectId:
          type: number
        currentTask:
          type: string
        room:
          type: string
        businessIdea:
          type: string
        phase:
          type: string
        nextMove:
          type: string
        runtimeConnectionId:
          type: number
        runtime:
          type: string
    Task:
      type: object
      required: [id, title, status, priority, projectId, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        status:
          type: string
          enum: [queued, active, review, done]
        priority:
          type: string
          enum: [low, medium, high]
        projectId:
          type: number
        agentId:
          type: [number, "null"]
        createdAt:
          type: string
          format: date-time
    TaskInput:
      type: object
      required: [title, projectId]
      properties:
        title:
          type: string
          minLength: 1
        projectId:
          type: number
        agentId:
          type: number
        priority:
          type: string
          enum: [low, medium, high]
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        status:
          type: string
          enum: [queued, active, review, done]
        priority:
          type: string
          enum: [low, medium, high]
        agentId:
          type: number
    Skill:
      type: object
      required: [id, name, description, category, enabled, sourceKind, sourceName, compatibleRuntimes, installMethod, importState, requiresApproval, sideEffectRisk]
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: string
        category:
          type: string
        enabled:
          type: boolean
        sourceKind:
          type: string
          enum: [custom, catalog]
        sourceName:
          type: string
        sourceUrl:
          type: [string, "null"]
        externalId:
          type: [string, "null"]
        compatibleRuntimes:
          type: array
          items:
            type: string
        installMethod:
          type: string
        importState:
          type: string
          enum: [operator_created, imported, unavailable, invalid]
        importError:
          type: [string, "null"]
        requiresApproval:
          type: boolean
        sideEffectRisk:
          type: string
          enum: [low, medium, high, unknown]
        importedAt:
          type: [string, "null"]
          format: date-time
    SkillInput:
      type: object
      required: [name, description, category]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
    AgentCapability:
      type: object
      required: [id, agentId, skillId, name, description, category, attachedAt]
      properties:
        id:
          type: number
        agentId:
          type: number
        skillId:
          type: number
        name:
          type: string
        description:
          type: string
        category:
          type: string
        attachedAt:
          type: string
          format: date-time
        installationStatus:
          type: string
          enum: [queued, installing, installed, failed, not_supported, awaiting_approval, blocked]
        installationMessage:
          type: string
        installationUpdatedAt:
          type: [string, "null"]
          format: date-time
    SkillInstallation:
      type: object
      required: [id, agentId, skillId, runtimeConnectionId, status, message, providerRequestId, createdAt, updatedAt]
      properties:
        id:
          type: number
        agentId:
          type: number
        skillId:
          type: number
        runtimeConnectionId:
          type: [number, "null"]
        status:
          type: string
          enum: [queued, installing, installed, failed, not_supported, awaiting_approval, blocked]
        message:
          type: string
        providerRequestId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EquipAgentSkillResult:
      type: object
      required: [capability, installation]
      properties:
        capability:
          $ref: "#/components/schemas/AgentCapability"
        installation:
          $ref: "#/components/schemas/SkillInstallation"
    SkillCatalogRefreshResult:
      type: object
      required: [imported, updated, skipped, errors, sources]
      properties:
        imported:
          type: number
        updated:
          type: number
        skipped:
          type: number
        errors:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: object
            required: [name, repositoryUrl, skillsPath]
            properties:
              name:
                type: string
              repositoryUrl:
                type: string
              skillsPath:
                type: string
    AgentCapabilityInput:
      type: object
      required: [skillId]
      properties:
        skillId:
          type: number
    Approval:
      type: object
      required: [id, projectId, agentId, title, action, details, risk, status, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        agentId:
          type: number
        title:
          type: string
        action:
          type: string
        details:
          type: string
        risk:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [pending, approved, rejected, changes_requested, handed_off]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, "null"]
    ApprovalUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected, changes_requested, handed_off]
    ArenaScore:
      type: object
      required: [agentId, agentName, score, incomeCents]
      properties:
        agentId:
          type: number
        agentName:
          type: string
        score:
          type: number
        incomeCents:
          type: number
        businessIdea:
          type: string
        room:
          type: string
        computerStatus:
          type: string
        phase:
          type: string
        nextMove:
          type: string
        progressPercent:
          type: number
        scaleRevenueCents:
          type: number
        assignedSkills:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: string
        toolAccess:
          type: array
          items:
            $ref: "#/components/schemas/ToolAccess"
    ToolAccess:
      type: object
      required: [key, label, description, available, status, unlockCondition, source, overrideAction, overrideReason, lastChangedAt]
      properties:
        key:
          type: string
        label:
          type: string
        description:
          type: string
        available:
          type: boolean
        status:
          type: string
          enum: [available, locked]
        unlockRound:
          type: [number, "null"]
        unlockCondition:
          type: string
        source:
          type: string
