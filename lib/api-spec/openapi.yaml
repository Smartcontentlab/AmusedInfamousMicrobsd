openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mission Control API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Command center overview
  - name: planning
    description: Main-agent idea shaping and launch checkpoints
  - name: projects
    description: Project portfolio management
  - name: agents
    description: AI agent roster management
  - name: capabilities
    description: Agent tool and skill assignments
  - name: approvals
    description: Human approval queue
  - name: tasks
    description: Work queue and kanban operations
  - name: skills
    description: Reusable agent skill packs
  - name: arena
    description: BuildOff simulation controls
  - name: staff
    description: AI employee capabilities and human approvals
  - name: runtimes
    description: Secure runtime connections and live staff controls
  - name: personal
    description: The operator's own to-do list, separate from project work
  - name: inbox
    description: Unified Atlas inbox — attention, approvals and messages
  - name: models
    description: Inference model catalog and per-agent model assignment
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get command center overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /mission-plans:
    get:
      operationId: listMissionPlans
      tags: [planning]
      summary: List saved main-agent plans
      responses:
        "200":
          description: Saved idea plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissionPlan"
    post:
      operationId: createMissionPlan
      tags: [planning]
      summary: Turn a brain dump into an actionable mission plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionPlanInput"
      responses:
        "201":
          description: Mission plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionPlan"
        "400":
          description: The brain dump is missing or too short after trimming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Project portfolio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents
      responses:
        "200":
          description: Agent roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Add an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /agents/{agentId}:
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update agent assignment or state
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /agents/{agentId}/capabilities:
    get:
      operationId: listAgentCapabilities
      tags: [capabilities]
      summary: List an agent's capabilities
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Attached capability packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentCapability"
    post:
      operationId: attachAgentCapability
      tags: [capabilities]
      summary: Attach a capability to an agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCapabilityInput"
      responses:
        "201":
          description: Capability attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCapability"
  /agents/{agentId}/capabilities/{skillId}:
    delete:
      operationId: detachAgentCapability
      tags: [capabilities]
      summary: Detach a capability from an agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/SkillId"
      responses:
        "204":
          description: Capability detached
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List human approval requests
      responses:
        "200":
          description: Approval queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
  /approvals/{approvalId}:
    patch:
      operationId: updateApproval
      tags: [approvals]
      summary: Resolve or hand off an approval request
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalUpdate"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List work queue tasks
      responses:
        "200":
          description: Work queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Add work to the queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Move or update a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /skills/facets:
    get:
      operationId: getSkillFacets
      tags: [skills]
      summary: Counts and filter options for the skill library
      responses:
        "200":
          description: Library facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillFacets"
  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: Search reusable skill packs
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: category
          required: false
          schema:
            type: string
        - in: query
          name: source
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: number
        - in: query
          name: offset
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Skill collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
    post:
      operationId: createSkill
      tags: [skills]
      summary: Add a skill pack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInput"
      responses:
        "201":
          description: Skill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
  /skills/refresh:
    post:
      operationId: refreshSkillCatalog
      tags: [skills]
      summary: Refresh the approved Hermes and OpenClaw skill catalogs
      responses:
        "200":
          description: Catalog refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillCatalogRefreshResult"
  /agents/{agentId}/skills/{skillId}/equip:
    post:
      operationId: equipAgentSkill
      tags: [capabilities]
      summary: Equip a skill and request a safe runtime installation
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/SkillId"
      responses:
        "200":
          description: Skill already equipped or queued for installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipAgentSkillResult"
        "201":
          description: Skill equipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipAgentSkillResult"
  /arena:
    get:
      operationId: getArena
      tags: [arena]
      summary: Get BuildOff simulation state
      responses:
        "200":
          description: Arena state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arena"
  /arena/advance:
    post:
      operationId: advanceArena
      tags: [arena]
      summary: Advance the BuildOff simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArenaAdvanceInput"
      responses:
        "200":
          description: Updated arena state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arena"
  /arena/evidence:
    get:
      operationId: listArenaEvidence
      tags: [arena]
      summary: List verified BuildOff business evidence
      responses:
        "200":
          description: Verified evidence records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaEvidenceList"
    post:
      operationId: createArenaEvidence
      tags: [arena]
      summary: Record a Game Master verified business result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArenaEvidenceInput"
      responses:
        "201":
          description: Recorded evidence and recalculated score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaEvidenceResult"
  /runtime-connections:
    get:
      operationId: listRuntimeConnections
      tags: [runtimes]
      summary: List redacted runtime connections
      responses:
        "200":
          description: Runtime connections without secrets or URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeConnectionSafe"
    post:
      operationId: createRuntimeConnection
      tags: [runtimes]
      summary: Add a server-side runtime connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeConnectionInput"
      responses:
        "201":
          description: Runtime connection added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConnectionSafe"
  /runtime-connections/{connectionId}:
    delete:
      operationId: deleteRuntimeConnection
      tags: [runtimes]
      summary: Remove a runtime link
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Runtime link removed
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: number
  /runtime-connections/{connectionId}/check:
    post:
      operationId: checkRuntimeConnection
      tags: [runtimes]
      summary: Check a runtime and discover capabilities
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Runtime health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeHealth"
  /runtime-health:
    get:
      operationId: listRuntimeHealth
      tags: [runtimes]
      summary: List runtime health snapshots
      responses:
        "200":
          description: Runtime health
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeHealth"
  /agents/{agentId}/run:
    get:
      operationId: getAgentRun
      tags: [runtimes]
      summary: Get an agent's current or most recent run
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent run, or null when no run exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "204":
          description: No run exists
    post:
      operationId: launchAgentRun
      tags: [runtimes]
      summary: Launch a live agent run
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunInput"
      responses:
        "201":
          description: Live run launched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
  /agents/{agentId}/run/pause:
    post:
      operationId: pauseAgentRun
      tags: [runtimes]
      summary: Pause an agent run when supported
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Paused run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
  /agents/{agentId}/run/resume:
    post:
      operationId: resumeAgentRun
      tags: [runtimes]
      summary: Resume an agent run when supported
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Resumed run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
  /agents/{agentId}/run/stop:
    post:
      operationId: stopAgentRun
      tags: [runtimes]
      summary: Safely stop an agent run
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Stopped run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
  /agents/{agentId}/activity:
    get:
      operationId: listAgentActivity
      tags: [runtimes]
      summary: List recent activity for an agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent runtime activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /agents/{agentId}/tool-unlocks:
    get:
      operationId: getAgentToolAccess
      tags: [arena]
      summary: Get a contestant's current Season 0 tool permissions and audit trail
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Tool permission state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolAccess"
  /agents/{agentId}/tool-unlocks/{toolKey}:
    patch:
      operationId: updateAgentToolUnlock
      tags: [arena]
      summary: Grant or revoke one named contestant tool with an auditable reason
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - in: path
          name: toolKey
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolUnlockInput"
      responses:
        "200":
          description: Updated tool permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolAccess"
  /personal-todos:
    get:
      operationId: listPersonalTodos
      tags: [personal]
      summary: List the operator's personal to-do items
      responses:
        "200":
          description: Personal to-do items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalTodo"
    post:
      operationId: createPersonalTodo
      tags: [personal]
      summary: Add a personal to-do item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalTodoInput"
      responses:
        "201":
          description: Created to-do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalTodo"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /personal-todos/{todoId}:
    patch:
      operationId: updatePersonalTodo
      tags: [personal]
      summary: Complete, reopen or rename a personal to-do item
      parameters:
        - $ref: "#/components/parameters/TodoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalTodoUpdate"
      responses:
        "200":
          description: Updated to-do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalTodo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePersonalTodo
      tags: [personal]
      summary: Remove a personal to-do item
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /arena/levels:
    get:
      operationId: getArenaLevels
      tags: [arena]
      summary: The season's levels, which are playable now, and today's turn budget
      responses:
        "200":
          description: Levels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaLevels"
  /arena/levels/{level}/run:
    post:
      operationId: runArenaLevel
      tags: [arena]
      summary: Run one level for every contestant on their own model
      parameters:
        - in: path
          name: level
          required: true
          schema:
            type: number
      responses:
        "202":
          description: Level started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaRunStarted"
        "409":
          description: Locked or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Daily budget reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /arena/turns:
    get:
      operationId: listArenaTurns
      tags: [arena]
      summary: Recent contestant turns, newest first
      parameters:
        - in: query
          name: level
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Turns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArenaTurn"
  /arena/race:
    get:
      operationId: getArenaRace
      tags: [arena]
      summary: The race to the prize, with contestant profiles and standings
      responses:
        "200":
          description: Race state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaRace"
  /agents/{agentId}/profile:
    patch:
      operationId: setContestantProfile
      tags: [arena]
      summary: Set a contestant's personality, catchphrase and trait ratings
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestantProfileInput"
      responses:
        "200":
          description: Updated contestant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContestantProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: List models available from the configured inference provider
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalog"
  /agents/{agentId}/model:
    patch:
      operationId: setAgentModel
      tags: [models]
      summary: Choose which model an agent runs on
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentModelInput"
      responses:
        "200":
          description: Updated agent model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentModelInput"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}/detail:
    get:
      operationId: getProjectDetail
      tags: [projects]
      summary: Everything needed to run one project on a single screen
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agents/{agentId}/loops:
    get:
      operationId: listAgentLoops
      tags: [agents]
      summary: List an agent's repeatable loops
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent loops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentLoop"
    post:
      operationId: createAgentLoop
      tags: [agents]
      summary: Add a repeatable loop to an agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentLoopInput"
      responses:
        "201":
          description: Created loop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLoop"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-loops/{loopId}:
    patch:
      operationId: updateAgentLoop
      tags: [agents]
      summary: Enable, disable or edit a repeatable loop
      parameters:
        - $ref: "#/components/parameters/LoopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentLoopUpdate"
      responses:
        "200":
          description: Updated loop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLoop"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAgentLoop
      tags: [agents]
      summary: Remove a repeatable loop
      parameters:
        - $ref: "#/components/parameters/LoopId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /inbox:
    get:
      operationId: getInbox
      tags: [inbox]
      summary: Get the unified inbox grouped into attention, approvals and messages
      responses:
        "200":
          description: Inbox contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
  /direct-messages:
    post:
      operationId: createDirectMessage
      tags: [inbox]
      summary: Send a message to Atlas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectMessageInput"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /direct-messages/{messageId}/read:
    patch:
      operationId: markDirectMessageRead
      tags: [inbox]
      summary: Mark a message as read
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
